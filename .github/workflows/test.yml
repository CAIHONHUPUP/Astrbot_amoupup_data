# 四插件统一 CI 契约（forever / data / photo / watch）。
# 本文件四份必须保持一致；改动请四仓库同步。
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 版本一致性：有 tools/check_version.py 的仓库必跑，没有的明确跳过。
      - name: Version sync (if present)
        shell: bash
        run: |
          if [ -f tools/check_version.py ]; then
            python tools/check_version.py
          else
            echo "SKIP: tools/check_version.py not present"
          fi

      - name: Tests
        run: coverage run --rcfile=.coveragerc -m pytest tests -q -p no:cacheprovider

      - name: Coverage floor
        run: coverage report --rcfile=.coveragerc

      # 质量门禁：有 tools/quality_gate.py 的仓库必跑，没有的明确跳过。
      - name: Quality gate (fast, if present)
        shell: bash
        run: |
          if [ -f tools/quality_gate.py ]; then
            python tools/quality_gate.py --fast
          else
            echo "SKIP: tools/quality_gate.py not present"
          fi

  # mypy 基线是本地可选守卫，不进必跑矩阵（CI 的 mypy 版本一漂，错误数就抖）。
  # 本地跑法：pip install mypy && python tools/check_mypy_baseline.py
